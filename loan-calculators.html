<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Loan Calculators - EMI, Home, Car, Personal Loan | calcify.solutions</title>
    <meta name="description" content="Free loan calculators: EMI, home loan, car loan, personal loan, education loan, mortgage, and more. Instant results, no signup.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://calcify.solutions/loan-calculators.html">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', 'Poppins', sans-serif; }
        .dark { background-color: #0b1120; color: #e2e8f0; }
        .dark .bg-white { background-color: #1e293b !important; }
        .dark .border-gray-100, .dark .border-gray-200 { border-color: #334155 !important; }
        .dark .text-gray-600, .dark .text-gray-500 { color: #cbd5e1 !important; }
        .dark .text-gray-800, .dark .text-gray-900 { color: #f1f5f9 !important; }
        .dark .bg-gray-50 { background-color: #0f172a !important; }
        .dark .hover\:bg-gray-50:hover { background-color: #1e293b !important; }
        .dark-mode-toggle { cursor: pointer; background: #e2e8f0; padding: 8px 14px; border-radius: 40px; display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; font-weight: 500; }
        .dark .dark-mode-toggle { background: #334155; color: #e2e8f0; }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); }
        .calculator-card:hover { transform: translateY(-4px); box-shadow: 0 20px 25px -12px rgba(0,0,0,0.15); transition: all 0.2s; }
    </style>
</head>
<body class="bg-white text-gray-900 antialiased">
    <header class="sticky top-0 z-50 bg-white/95 backdrop-blur-sm border-b border-gray-200">
        <div class="container mx-auto px-5 lg:px-8 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2"><i class="fas fa-calculator text-2xl text-blue-500"></i><span class="text-xl font-bold">calcify<span class="text-blue-500">.solutions</span></span></a>
            <nav class="hidden md:flex items-center space-x-8 text-gray-700 font-medium">
                <a href="/" class="hover:text-blue-500">Home</a><a href="#" class="hover:text-blue-500">Calculators</a><a href="#" class="hover:text-blue-500">Categories</a><a href="#" class="hover:text-blue-500">Blog</a><a href="#" class="hover:text-blue-500">Contact</a>
            </nav>
            <div class="flex items-center gap-3"><button id="darkModeToggle" class="dark-mode-toggle"><i class="fas fa-moon"></i><span class="hidden sm:inline">Dark/Light</span></button><a href="#" class="hidden md:block bg-blue-500 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-blue-600">Explore Calculators</a><button id="menuToggle" class="md:hidden text-2xl"><i class="fas fa-bars"></i></button></div>
        </div>
    </header>
    <main class="container mx-auto px-5 lg:px-8 py-12">
        <div class="mb-8"><h1 class="text-4xl md:text-5xl font-bold text-gray-900">💰 Loan Calculators</h1><p class="text-gray-600 mt-3 text-lg">Calculate EMIs, total interest, loan affordability, and repayment schedules for various loan types.</p></div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="calculatorsList"></div>
    </main>
    <footer class="bg-gray-900 text-gray-300 pt-12 pb-6 mt-12"><div class="container mx-auto px-5 text-center text-sm">© 2025 calcify.solutions — Smart financial tools. <a href="#" class="hover:text-white">Sitemap</a></div></footer>
    <script>
        const calculators = [
            { name: "EMI Calculator", desc: "Calculate monthly installments for any loan amount, rate, and tenure.", link: "emi-calculator.html", icon: "fas fa-calculator" },
            { name: "Home Loan Calculator", desc: "Estimate home loan EMIs, interest, and total payment.", link: "home-loan-calculator.html", icon: "fas fa-home" },
            { name: "Car Loan Calculator", desc: "Plan your car loan EMIs with easy amortization.", link: "car-loan-calculator.html", icon: "fas fa-car" },
            { name: "Personal Loan Calculator", desc: "Quick personal loan EMI and affordability check.", link: "personal-loan-calculator.html", icon: "fas fa-user" },
            { name: "Education Loan Calculator", desc: "Plan education loan repayments.", link: "education-loan-calculator.html", icon: "fas fa-graduation-cap" },
            { name: "Loan Eligibility Calculator", desc: "Check how much loan you qualify for.", link: "loan-eligibility-calculator.html", icon: "fas fa-check-circle" },
            { name: "Loan Affordability Calculator", desc: "Determine affordable loan amount based on income.", link: "loan-affordability-calculator.html", icon: "fas fa-chart-line" },
            { name: "Mortgage Calculator", desc: "Detailed mortgage payment breakdown.", link: "mortgage-calculator.html", icon: "fas fa-building" }
        ];
        const container = document.getElementById('calculatorsList');
        container.innerHTML = calculators.map(calc => `
            <div class="bg-white rounded-2xl border border-gray-100 p-6 shadow-md hover:shadow-xl transition-all calculator-card">
                <div class="flex items-center gap-3 mb-3"><i class="${calc.icon} text-2xl text-blue-500"></i><h2 class="text-xl font-bold text-gray-800">${calc.name}</h2></div>
                <p class="text-gray-600 mb-5">${calc.desc}</p>
                <a href="${calc.link}" class="inline-flex items-center gap-2 bg-blue-500 text-white px-5 py-2.5 rounded-xl font-semibold hover:bg-blue-600 transition">Use Calculator <i class="fas fa-arrow-right"></i></a>
            </div>
        `).join('');
        // Dark mode & mobile menu (same as homepage)
        const darkToggle = document.getElementById('darkModeToggle');
        if(localStorage.getItem('darkMode') === 'enabled') document.body.classList.add('dark');
        darkToggle?.addEventListener('click', () => { document.body.classList.toggle('dark'); localStorage.setItem('darkMode', document.body.classList.contains('dark') ? 'enabled' : 'disabled'); });
    </script>
</body>
</html>
